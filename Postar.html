<style>
/* Layout: uma coluna de telemóvel. Editor em cima, redes e botão a seguir, contas no fim. */
:root {
  --bg: #eef1ee;
  --surface: #ffffff;
  --ink: #17201c;
  --muted: #5d6963;
  --line: #d3dad5;
  --accent: #0b5cd6;
  --accent-ink: #ffffff;
  --good: #1a7f4b;
  --bad: #b3261e;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "IBM Plex Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121614;
    --surface: #1b211e;
    --ink: #e9eeeb;
    --muted: #9aa7a0;
    --line: #2f3833;
    --accent: #6ea4ff;
    --accent-ink: #08142b;
    --good: #5fd39a;
    --bad: #ff8a80;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.45 var(--font-body);
  -webkit-text-size-adjust: 100%;
  padding: calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px)
           calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 16px);
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font: 700 30px/1 var(--font-display); letter-spacing: -0.02em; margin: 0; }
h2 { font: 600 18px/1.2 var(--font-display); margin: 0; }
.sub { color: var(--muted); font-size: 14px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.editor { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
textarea {
  width: 100%; min-height: 168px; resize: vertical; border: 0; outline: 0; padding: 4px;
  background: transparent; color: var(--ink); font: 400 17px/1.45 var(--font-body);
}
.counts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.count b { color: var(--ink); font-weight: 600; }
.count.over, .count.over b { color: var(--bad); }
.counts .spacer { flex: 1; }

.images { display: flex; flex-wrap: wrap; gap: 8px; }
.thumb { position: relative; width: 84px; display: flex; flex-direction: column; gap: 4px; }
.thumb img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); display: block; }
.thumb button { position: absolute; top: -8px; right: -8px; width: 26px; height: 26px; min-height: 0; padding: 0;
  border-radius: 50%; background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-size: 15px; line-height: 1; }
.thumb input { width: 84px; font-size: 11px; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); }
.add-image { width: 84px; height: 84px; border-radius: 10px; border: 1px dashed var(--line); background: transparent;
  color: var(--muted); font-size: 28px; min-height: 0; line-height: 1; }
.add-image:disabled { opacity: .35; }

.nets { display: flex; flex-direction: column; }
.net { display: flex; align-items: center; gap: 12px; padding: 12px; min-height: 56px; }
.net + .net { border-top: 1px solid var(--line); }
.net label { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; font-weight: 500; }
.net input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.state { font-size: 13px; color: var(--muted); text-align: right; overflow-wrap: anywhere; max-width: 60%; }
.state.ok { color: var(--good); font-weight: 600; }
.state.err { color: var(--bad); }
.state a { color: inherit; }

button {
  font: 600 17px/1 var(--font-body); border-radius: 12px; border: 1px solid transparent;
  min-height: 50px; padding: 0 18px; cursor: pointer;
}
.primary { background: var(--accent); color: var(--accent-ink); width: 100%; }
.primary:disabled { opacity: .45; cursor: default; }
.quiet { background: transparent; color: var(--accent); border-color: var(--line); min-height: 40px; font-size: 15px; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

.accounts { padding: 14px 12px; display: flex; flex-direction: column; gap: 14px; }
.accounts[hidden] { display: none; }
fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
legend { font: 600 15px/1.2 var(--font-display); padding: 0; margin-bottom: 6px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.field input, .field select {
  font: 400 16px/1.2 var(--font-body); color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%;
}
.note { font-size: 13px; color: var(--muted); margin: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
@media (prefers-reduced-motion: no-preference) { button { transition: opacity .15s; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Postar</h1>
    <button class="quiet" id="toggle-accounts" type="button" aria-expanded="false" aria-controls="accounts">Contas</button>
  </header>

  <section class="card editor" aria-label="Texto do post">
    <textarea id="text" placeholder="Escreve o post…" autocapitalize="sentences"></textarea>
    <div class="images" id="images"></div>
    <input type="file" id="file-input" accept="image/*" multiple hidden>
    <div class="counts">
      <span class="count" id="count-masto">Mastodon <b>0</b>/500</span>
      <span class="count" id="count-bsky">Bluesky <b>0</b>/300</span>
      <span class="spacer"></span>
      <button class="quiet" id="add-image" type="button">+ Imagem</button>
    </div>
  </section>

  <section class="card nets" aria-label="Redes">
    <div class="net">
      <label for="on-masto"><input type="checkbox" id="on-masto" checked> Mastodon</label>
      <span class="state" id="state-masto" role="status"></span>
    </div>
    <div class="net">
      <label for="on-bsky"><input type="checkbox" id="on-bsky" checked> Bluesky</label>
      <span class="state" id="state-bsky" role="status"></span>
    </div>
  </section>

  <button class="primary" id="send" type="button">Publicar</button>

  <section class="card accounts" id="accounts" hidden aria-label="Contas">
    <div>
      <h2>Contas</h2>
      <p class="note">As credenciais ficam guardadas só neste iPhone e são enviadas apenas à tua instância Mastodon e ao Bluesky.</p>
    </div>
    <fieldset>
      <legend>Mastodon</legend>
      <label class="field" for="m-url">Instância
        <input id="m-url" type="url" inputmode="url" placeholder="https://mastodon.social" autocapitalize="none" autocorrect="off" spellcheck="false">
      </label>
      <label class="field" for="m-token">Access token (âmbito write:statuses)
        <input id="m-token" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      </label>
      <label class="field" for="m-vis">Visibilidade
        <select id="m-vis">
          <option value="public">Pública</option>
          <option value="unlisted">Não listada</option>
          <option value="private">Só seguidores</option>
        </select>
      </label>
    </fieldset>
    <fieldset>
      <legend>Bluesky</legend>
      <label class="field" for="b-handle">Handle
        <input id="b-handle" type="text" placeholder="nome.bsky.social" autocapitalize="none" autocorrect="off" spellcheck="false">
      </label>
      <label class="field" for="b-pass">Palavra-passe de aplicação
        <input id="b-pass" type="password" placeholder="xxxx-xxxx-xxxx-xxxx" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
      </label>
      <label class="field" for="b-pds">Servidor
        <input id="b-pds" type="url" inputmode="url" placeholder="https://bsky.social" autocapitalize="none" autocorrect="off" spellcheck="false">
      </label>
    </fieldset>
    <div class="row">
      <button class="quiet" id="save" type="button">Guardar contas</button>
      <span class="sub" id="save-note" role="status"></span>
    </div>
  </section>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const LIMITS = { masto: 500, bsky: 300 };
const KEY_CFG = "postar.cfg", KEY_DRAFT = "postar.rascunho";

// --- Armazenamento local (pode falhar em modo privado) ---
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }
};
let cfg = Object.assign({ mUrl: "", mToken: "", mVis: "public", bHandle: "", bPass: "", bPds: "" }, store.get(KEY_CFG, {}));

// --- Utilitários de texto ---
// Conta grafemas (o Bluesky limita a 300 grafemas, não a 300 bytes)
function graphemes(s) {
  if (window.Intl && Intl.Segmenter) return [...new Intl.Segmenter().segment(s)].length;
  return [...s].length;
}
// O Bluesky não cria links sozinho: é preciso indicar posições em bytes UTF-8 (facets)
function buildFacets(text) {
  const enc = new TextEncoder();
  const bytes = s => enc.encode(s).length;
  const facets = [];
  for (const m of text.matchAll(/https?:\/\/[^\s<>"']+/g)) {
    const uri = m[0].replace(/[.,;:!?)\]]+$/, "");
    const start = bytes(text.slice(0, m.index));
    facets.push({ index: { byteStart: start, byteEnd: start + bytes(uri) },
                  features: [{ $type: "app.bsky.richtext.facet#link", uri }] });
  }
  for (const m of text.matchAll(/(^|\s)#([\p{L}\p{N}_]+)/gu)) {
    if (/^\d+$/.test(m[2])) continue; // "#123" não é hashtag
    const start = bytes(text.slice(0, m.index + m[1].length));
    facets.push({ index: { byteStart: start, byteEnd: start + bytes("#" + m[2]) },
                  features: [{ $type: "app.bsky.richtext.facet#tag", tag: m[2] }] });
  }
  return facets;
}
function normUrl(u, fallback) {
  u = (u || "").trim() || fallback || "";
  if (u && !/^https?:\/\//i.test(u)) u = "https://" + u;
  return u.replace(/\/+$/, "");
}
async function readError(res) {
  let msg = "";
  try { const j = await res.json(); msg = j.error_description || j.message || j.error || ""; } catch {}
  if (res.status === 401) return "Credenciais recusadas. Confirma-as em Contas.";
  return msg ? `${msg} (${res.status})` : `Erro ${res.status}`;
}

// --- Imagens: redimensiona para no máx. 2048px e converte para JPEG (GIF fica tal e qual, por causa da animação) ---
const MAX_IMAGES = 4;
let images = []; // { id, file, url, alt }
async function processImage(file) {
  if (file.type === "image/gif") return file;
  const dataUrl = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file);
  });
  const img = await new Promise((res, rej) => {
    const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUrl;
  });
  const maxDim = 2048;
  let { width, height } = img;
  if (width > maxDim || height > maxDim) {
    const scale = maxDim / Math.max(width, height);
    width = Math.round(width * scale); height = Math.round(height * scale);
  }
  const canvas = document.createElement("canvas");
  canvas.width = width; canvas.height = height;
  canvas.getContext("2d").drawImage(img, 0, 0, width, height);
  const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.85));
  return new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" });
}

// --- Publicação ---
async function uploadMastodonMedia(file, alt) {
  const base = normUrl(cfg.mUrl);
  const fd = new FormData();
  fd.append("file", file);
  if (alt) fd.append("description", alt);
  const res = await fetch(base + "/api/v2/media", {
    method: "POST",
    headers: { "Authorization": "Bearer " + cfg.mToken.trim() },
    body: fd
  });
  if (res.status !== 200 && res.status !== 202) throw new Error(await readError(res));
  let data = await res.json();
  // Enquanto o servidor ainda está a processar a imagem (202), espera que fique pronta
  for (let tries = 0; !data.url && tries < 15; tries++) {
    await new Promise(r => setTimeout(r, 1000));
    const check = await fetch(base + "/api/v1/media/" + data.id, { headers: { "Authorization": "Bearer " + cfg.mToken.trim() } });
    if (!check.ok) throw new Error(await readError(check));
    data = await check.json();
  }
  return data.id;
}
async function postMastodon(text, imgs) {
  const base = normUrl(cfg.mUrl);
  const mediaIds = [];
  for (const im of imgs) mediaIds.push(await uploadMastodonMedia(im.file, im.alt));
  const body = { status: text, visibility: cfg.mVis };
  if (mediaIds.length) body.media_ids = mediaIds;
  const res = await fetch(base + "/api/v1/statuses", {
    method: "POST",
    headers: { "Authorization": "Bearer " + cfg.mToken.trim(), "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(await readError(res));
  return (await res.json()).url;
}
async function uploadBlueskyBlob(pds, token, file) {
  const res = await fetch(pds + "/xrpc/com.atproto.repo.uploadBlob", {
    method: "POST",
    headers: { "Authorization": "Bearer " + token, "Content-Type": file.type || "application/octet-stream" },
    body: file
  });
  if (!res.ok) throw new Error(await readError(res));
  return (await res.json()).blob;
}
async function postBluesky(text, imgs) {
  const pds = normUrl(cfg.bPds, "https://bsky.social");
  const handle = cfg.bHandle.trim().replace(/^@/, "");
  const login = await fetch(pds + "/xrpc/com.atproto.server.createSession", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ identifier: handle, password: cfg.bPass.trim() })
  });
  if (!login.ok) throw new Error(await readError(login));
  const s = await login.json();
  const record = { $type: "app.bsky.feed.post", text, createdAt: new Date().toISOString() };
  const facets = buildFacets(text);
  if (facets.length) record.facets = facets;
  if (imgs.length) {
    const blobs = [];
    for (const im of imgs) blobs.push({ image: await uploadBlueskyBlob(pds, s.accessJwt, im.file), alt: im.alt || "" });
    record.embed = { $type: "app.bsky.embed.images", images: blobs };
  }
  const res = await fetch(pds + "/xrpc/com.atproto.repo.createRecord", {
    method: "POST",
    headers: { "Authorization": "Bearer " + s.accessJwt, "Content-Type": "application/json" },
    body: JSON.stringify({ repo: s.did, collection: "app.bsky.feed.post", record })
  });
  if (!res.ok) throw new Error(await readError(res));
  const rkey = (await res.json()).uri.split("/").pop();
  return `https://bsky.app/profile/${s.handle || handle}/post/${rkey}`;
}

// --- Interface ---
const nets = {
  masto: { ready: () => !!(cfg.mUrl.trim() && cfg.mToken.trim()), post: postMastodon },
  bsky:  { ready: () => !!(cfg.bHandle.trim() && cfg.bPass.trim()), post: postBluesky }
};
let sending = false;

function renderImages() {
  const wrap = $("images");
  wrap.innerHTML = "";
  for (const im of images) {
    const t = document.createElement("div"); t.className = "thumb";
    const img = document.createElement("img"); img.src = im.url; img.alt = "";
    const rm = document.createElement("button"); rm.type = "button"; rm.textContent = "×";
    rm.setAttribute("aria-label", "Remover imagem");
    rm.addEventListener("click", () => { URL.revokeObjectURL(im.url); images = images.filter(x => x !== im); renderImages(); refresh(false); });
    const alt = document.createElement("input"); alt.type = "text"; alt.placeholder = "Descrição";
    alt.value = im.alt; alt.addEventListener("input", () => { im.alt = alt.value; });
    t.append(img, rm, alt);
    wrap.append(t);
  }
  $("add-image").disabled = images.length >= MAX_IMAGES;
}
async function addImageFiles(files) {
  files = files.slice(0, MAX_IMAGES - images.length);
  for (const file of files) {
    try {
      const processed = await processImage(file);
      images.push({ file: processed, url: URL.createObjectURL(processed), alt: "" });
    } catch { /* imagem ilegível: ignora-a */ }
  }
  renderImages(); refresh(false);
}
$("add-image").addEventListener("click", () => $("file-input").click());
$("file-input").addEventListener("change", e => {
  const files = [...e.target.files]; e.target.value = "";
  addImageFiles(files);
});
// Colar uma imagem copiada de outra app (Fotos, Safari, etc.) diretamente no texto
$("text").addEventListener("paste", e => {
  const files = [...(e.clipboardData?.items || [])]
    .filter(it => it.kind === "file" && it.type.startsWith("image/"))
    .map(it => it.getAsFile())
    .filter(Boolean);
  if (files.length) { e.preventDefault(); addImageFiles(files); }
});

function setState(net, text, cls, href) {
  const el = $("state-" + net);
  el.className = "state" + (cls ? " " + cls : "");
  el.textContent = "";
  if (href) { const a = document.createElement("a"); a.href = href; a.target = "_blank"; a.rel = "noopener"; a.textContent = text; el.append(a); }
  else el.textContent = text;
}
function refresh(resetStates) {
  const text = $("text").value, n = graphemes(text.trim());
  let blocked = !n && !images.length;
  let any = false;
  for (const net of Object.keys(nets)) {
    const c = $("count-" + net);
    c.querySelector("b").textContent = n;
    const on = $("on-" + net).checked, over = n > LIMITS[net];
    c.classList.toggle("over", over);
    if (resetStates) setState(net, nets[net].ready() ? "Pronto" : "Falta configurar");
    if (on) { any = true; if (over || !nets[net].ready()) blocked = true; }
  }
  $("send").disabled = sending || blocked || !any;
}
function showAccounts(open) {
  $("accounts").hidden = !open;
  $("toggle-accounts").setAttribute("aria-expanded", String(open));
  $("toggle-accounts").textContent = open ? "Fechar contas" : "Contas";
}
function fillForm() {
  $("m-url").value = cfg.mUrl; $("m-token").value = cfg.mToken; $("m-vis").value = cfg.mVis;
  $("b-handle").value = cfg.bHandle; $("b-pass").value = cfg.bPass; $("b-pds").value = cfg.bPds;
}

$("toggle-accounts").addEventListener("click", () => showAccounts($("accounts").hidden));
$("save").addEventListener("click", () => {
  cfg = { mUrl: $("m-url").value, mToken: $("m-token").value, mVis: $("m-vis").value,
          bHandle: $("b-handle").value, bPass: $("b-pass").value, bPds: $("b-pds").value };
  $("save-note").textContent = store.set(KEY_CFG, cfg) ? "Guardado." : "Não foi possível guardar neste dispositivo.";
  refresh(true);
});
$("text").addEventListener("input", () => { store.set(KEY_DRAFT, $("text").value); refresh(false); });
for (const net of Object.keys(nets)) $("on-" + net).addEventListener("change", () => refresh(false));

$("send").addEventListener("click", async () => {
  if (sending) return;
  const text = $("text").value.trim();
  const chosen = Object.keys(nets).filter(n => $("on-" + n).checked);
  sending = true; refresh(false);
  $("send").textContent = images.length ? "A publicar e a enviar imagens…" : "A publicar…";
  // As duas redes são independentes: a falha de uma não impede a outra
  const results = await Promise.all(chosen.map(async net => {
    setState(net, "A enviar…");
    try {
      const url = await nets[net].post(text, images);
      setState(net, "Publicado. Abrir", "ok", url);
      return true;
    } catch (e) {
      const offline = e instanceof TypeError;
      setState(net, offline ? "Sem ligação ou servidor inacessível. Tenta de novo." : e.message, "err");
      return false;
    }
  }));
  sending = false;
  $("send").textContent = "Publicar";
  if (results.every(Boolean)) {
    $("text").value = ""; store.set(KEY_DRAFT, "");
    images.forEach(im => URL.revokeObjectURL(im.url)); images = []; renderImages();
  } else {
    // Mantém o texto e as imagens, e desmarca as redes já publicadas, para não duplicar ao repetir
    chosen.forEach((net, i) => { if (results[i]) $("on-" + net).checked = false; });
  }
  refresh(false);
});

// Arranque
fillForm();
$("text").value = store.get(KEY_DRAFT, "");
showAccounts(!nets.masto.ready() && !nets.bsky.ready());
refresh(true);
</script>
</body>
</html>
